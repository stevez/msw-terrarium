name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `--force` sidesteps npm's peer-dep validation crash on optional peers
      # ("Exit handler never called!"). Matches GRIP-UI's working config.
      - run: npm install --force --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Coverage
        run: npm run test:coverage
